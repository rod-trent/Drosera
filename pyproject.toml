[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drosera"
version = "0.1.0"
description = "A carnivorous honeypot for autonomous AI agents. Sweet-looking bait. Sticky ending."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Rod Trent", email = "rodtrent@gmail.com" }]
keywords = [
  "honeypot", "security", "ai-agents", "agentic-ai", "deception",
  "tarpit", "prompt-injection", "canary-tokens", "threat-detection",
  "llm-security", "bot-detection",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.16,<0.17", "mypy>=1.8"]

[project.urls]
Homepage = "https://github.com/rod-trent/Drosera"
Repository = "https://github.com/rod-trent/Drosera"
Issues = "https://github.com/rod-trent/Drosera/issues"
Documentation = "https://github.com/rod-trent/Drosera/tree/main/docs"

[project.scripts]
drosera = "drosera.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
drosera = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# SIM905: the word banks in trap/tarpit.py are far more readable as split
# strings than as forty-element list literals.
ignore = ["E501", "SIM905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning"]
